<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Histórico de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/pages/historico.css">
  <link rel="stylesheet" href="../assets/css/tema.css">
  <link rel="stylesheet" href="../assets/css/ponte.css">
</head>
<body>
  <div class="container historico-card shadow">
    <header class="vu-pagina-topo">
      <div>
        <h1 class="historico-title">Histórico</h1>
        <p id="historico-resumo">Tarefas concluídas nos últimos 12 meses</p>
      </div>
      <div class="vu-acoes-topo">
        <button id="voltar-button" class="vu-btn">
          <i class="bi bi-kanban"></i> Abrir o Mural
        </button>
      </div>
    </header>

    <div class="vu-barra-filtros">
      <div class="vu-barra-filtros-linha">
        <div class="vu-busca">
          <i class="bi bi-search vu-ico"></i>
          <input type="search" id="search-input" placeholder="Protocolo, teste ou proprietário" aria-label="Buscar no Histórico">
        </div>
        <!-- Aparece só quando há busca: vira "Limpar" -->
        <button id="search-button" class="vu-btn vu-btn-fantasma" type="button">
          <i class="bi bi-search"></i> Buscar
        </button>
        <div class="vu-filtros" id="historico-periodo" role="group" aria-label="Período">
          <span class="vu-filtros-marca"></span>
          <button type="button" class="vu-filtro" data-periodo="mes" aria-pressed="false">Este mês</button>
          <button type="button" class="vu-filtro" data-periodo="ano" aria-pressed="false">Este ano</button>
          <button type="button" class="vu-filtro" data-periodo="tudo" aria-pressed="true">12 meses</button>
        </div>
      </div>
    </div>

    <div id="historico-list" class="historico-list"></div>
    
    <div id="feedback" class="historico-feedback"></div>

    <!-- Modal de detalhes -->
    <div class="modal fade" id="modal-detalhes" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-success"><i class="bi bi-info-circle"></i> Detalhes da Tarefa</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="modal-detalhes-content">
            <!-- Conteúdo dinâmico -->
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de resultados -->
    <div class="modal fade" id="modal-resultados" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-success"><i class="bi bi-clipboard2-data"></i> Resultados</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="modal-resultados-content">
            <!-- Conteúdo dinâmico -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/utils/ui.js"></script>
  <script type="module" src="../assets/js/utils/casca.js"></script>
  <script type="module" src="../assets/js/pages/historico/historico.js"></script>
  <script type="module" src="../assets/js/pages/historico/baixarDoc.js"></script>
  <script type="module" src="../assets/js/pages/historico/resultado.js"></script>
</body>
</html>
