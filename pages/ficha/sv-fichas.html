<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fichas - Setor de Virologia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/pages/sv-fichas.css">
  <link rel="stylesheet" href="../../assets/css/tema.css">
  <link rel="stylesheet" href="../../assets/css/ponte.css">
</head>

<body class="sv-page">
  <div class="sv-container">
    <nav class="vu-trilha"><a href="../ficha-cadastro.html">Fichas</a><i class="bi bi-chevron-right"></i><span>Setor de Virologia</span></nav>
    <header class="vu-pagina-topo">
      <div>
        <h1>Fichas SV</h1>
        <p id="sv-resumo">Requisições e laudos salvos neste aparelho</p>
      </div>
      <div class="vu-acoes-topo">
        <a href="sv-requisicao.html" class="vu-btn vu-btn-principal"><i class="bi bi-plus-lg"></i> Nova requisição</a>
      </div>
      <span class="sv-usuario vu-oculto"></span>
    </header>

    <div class="vu-barra-filtros">
      <div class="vu-barra-filtros-linha">
        <div class="vu-busca">
          <i class="bi bi-search vu-ico"></i>
          <input type="search" id="busca-texto" placeholder="Protocolo ou proprietário" autocomplete="off" aria-label="Buscar ficha">
        </div>
        <div class="vu-filtros" data-espelho="busca-status" role="group" aria-label="Situação">
          <span class="vu-filtros-marca"></span>
          <button type="button" class="vu-filtro" data-valor="">Todas</button>
          <button type="button" class="vu-filtro" data-valor="Aguardando análise">Sem laudo</button>
          <button type="button" class="vu-filtro" data-valor="Laudo emitido">Emitidas</button>
        </div>
      </div>
      <details class="vu-mais-filtros">
        <summary><i class="bi bi-calendar3"></i> Filtrar por data de entrada</summary>
        <div class="vu-grade-2">
          <div class="vu-campo"><label for="busca-de">De</label><input type="date" id="busca-de" class="form-control"></div>
          <div class="vu-campo"><label for="busca-ate">Até</label><input type="date" id="busca-ate" class="form-control"></div>
        </div>
      </details>
      <select id="busca-status" class="vu-oculto" aria-hidden="true" tabindex="-1">
        <option value="">Todos</option>
        <option>Aguardando análise</option>
        <option>Laudo emitido</option>
      </select>
    </div>

    <div id="lista" class="sv-lista" aria-live="polite"></div>
  </div>

  <script src="../../assets/js/utils/ui.js"></script>
  <script type="module" src="../../assets/js/utils/casca.js"></script>
  <script type="module" src="../../assets/js/pages/ficha/sv-fichas.js"></script>
</body>
</html>
