<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta name="theme-color" content="#f3f6ee">
  <title>Secretaria | Virologia UFSM</title>
  <script src="../assets/js/utils/tema.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<body>
  <div class="secretaria-pagina">

      <div>
        <p class="vu-sobrelinha">Rotina</p>
        <h1>Secretaria</h1>
        <p id="secretaria-resumo" aria-live="polite">Carregando laudos…</p>

    <section id="secretaria-lista" class="secretaria-lista" aria-live="polite">
      <p class="secretaria-mensagem">Carregando laudos aguardando envio…</p>
